name: Node Skill
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --input-type=module -e "await import('./skills/agnes-video-v20/generate_from_storyboard.js')" -- --help || true
